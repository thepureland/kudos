#//region your codes 1
spring:
  datasource:
    dynamic:
      primary: h2
      hikari:
        connection-timeout: 3000
        validation-timeout: 5000
        idle-timeout: 600000
        leak-detection-threshold: 0
        max-lifetime: 1800000
        max-pool-size: 10
        min-idle: 10
        initialization-fail-timeout: 1
        is-auto-commit: false
        is-read-only: false
        is-isolate-internal-queries: false
        is-register-mbeans: false
        is-allow-pool-suspension: false
      datasource:
        h2:
          hikari:
            is-auto-commit: false
          driver-class-name: org.h2.Driver
          url: jdbc:h2:~/h2/${module};DATABASE_TO_LOWER=TRUE;
          username: sa
          password: sa


kudos:
  ability:
    # Set to false when developing locally without Redis, otherwise startup fails with RedisConnectionFailureException
    cache:
      enabled: true
    flyway:
      # datasource-config format: {datasource-key: [module-names]}
      datasource-config:
        h2: ${module}
#//endregion your codes 1

spring:
  datasource:
    dynamic:
      primary: h2
      hikari:
        connection-timeout: 3000
        validation-timeout: 5000
        idle-timeout: 600000
        leak-detection-threshold: 0
        max-lifetime: 1800000
        max-pool-size: 10
        min-idle: 10
        initialization-fail-timeout: 1
        is-auto-commit: false
        is-read-only: false
        is-isolate-internal-queries: false
        is-register-mbeans: false
        is-allow-pool-suspension: false
      datasource:
        master:
          hikari:
            is-auto-commit: false
          driver-class-name: org.h2.Driver
          # Per-JVM in-memory DB (not the shared file ~/h2/ds-master): H2 file mode is exclusive
          # per JVM, so concurrent test JVMs fail to open it and the context fails to load.
          url: jdbc:h2:mem:ds-master;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;
          username: sa
          password: sa
        h2:
          driver-class-name: org.h2.Driver
          # The URL is overridden at runtime by H2TestContainer to the shared H2 container with a
          # per-JVM-unique DB name (mem:test_<uuid>) so concurrent module test JVMs don't share one
          # `mem:test` and cross-contaminate fixtures. This inline value is only a fallback.
          url: jdbc:h2:tcp://localhost:1521/mem:test;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;
          username: sa
          password: sa


kudos:
  ability:
    flyway:
      # datasource-config format: {datasource-key: [module-names]}
      # All modules target the same h2 datasource.
      # Execution order: sys first (creates sys_cache / sys_dict and other sys tables that the
      # msg module`s `merge into "sys_*"` seed scripts depend on), then msg (msg tables + seeds).
      # `user` was dropped when msg-core switched from user-core to user-client: msg no longer
      # touches the user schema, it resolves contacts over Feign.
      datasource-config:
        h2: sys,msg
      execution-order:
        - h2


logging:
  level:
    org.springframework.core.io.support.SpringFactoriesLoader: DEBUG

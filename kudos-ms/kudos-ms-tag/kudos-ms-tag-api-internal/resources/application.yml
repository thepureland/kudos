spring:
  application:
    name: kudos-ms-tag-api-internal
  datasource:
    dynamic:
      primary: h2
      datasource:
        h2:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:~/h2/tag-internal;DATABASE_TO_LOWER=TRUE
          username: sa
          password: sa

kudos:
  ability:
    flyway:
      datasource-config:
        tag: h2

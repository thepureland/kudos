# kudos-ability-security-enforcement 模块默认配置
kudos:
  ability:
    security:
      enforcement:
        # 是否安装 URL 级鉴权过滤器。默认 false：权限点注册表填好之前打开会拒绝一切请求
        # （未注册路径按设计就是拒绝），所以必须显式开启。
        enabled: false
        # 影子模式：只记录"本该拒绝"，仍然放行。存量系统的迁移路径——先开影子模式跑真实流量，
        # 按 WARN 日志把权限点补齐，再关掉它。默认 true，避免一开就变成停机事件。
        shadow-mode: true
        # 公开路径必须显式声明。"没注册权限点"和"人人可访问"是两件事，不能长得一样。
        public-paths:
          - /actuator/**
          - /error
        # 需要带进条件求值上下文的请求头（ip 已自动带入）
        context-headers: []
        # 断路器:决策点确认挂掉后,不再逐个请求去付存储超时的代价。
        # 与本模块其它开关相反,默认开启——它不改变"拦什么",只决定拒绝多快到达。
        # 实测数据库停机时每个请求要等满 30 秒(数据源连接超时)才拒绝:拒绝是对的,
        # 花 30 秒去拒绝不是——请求线程是固定池,一次存储故障会变成整个服务不可用。
        #
        # 注意这里**没有单次超时配置,而且不可能有**:阻塞在某个调用上的线程无法中断它自己,
        # 而把决策挪到别的线程也不可行——主体解析读的是只存在于请求线程上的状态(曾这么做过,
        # 结果是所有已授权请求全被拒)。单次时限属于阻塞真正发生的地方:数据源的连接/套接字超时。
        # 本断路器负责的是"别一遍遍去付那个时限"。
        resilience:
          enabled: true
          # 连续失败多少次后认定决策点已挂
          failure-threshold: 5
          # 熔断打开后多久放一个探针请求。**不要短于一次失败调用本身的耗时**:
          # 原本是 10 秒,而失败一次要等满数据源 30 秒连接超时——窗口早在那次调用返回前就过期了,
          # 下个请求到达时断路器已是半开,于是几乎每个请求都变成探针、照付 30 秒。
          # 实测:窗口内到达的第二波请求 60 秒 → 30 秒;窗口外则毫无改善。
          open-millis: 30000
    # 权限点注册：与 enforcement 是两个独立开关，且顺序固定——先注册、影子模式验证、再强制。
    # 若二者共用一个开关，就只能"先打开强制、然后被拒绝一切"才能填注册表，正是这个特性要消除的死锁。
    point-registration:
      # 默认 true：注册一个权限点不授予任何人任何权限，只是让动作可被命名——这是能开启 URL 强制的前提。
      enabled: true
      # 只打日志不落库，用于先看清命名约定会把陌生的路径布局翻译成什么
      dry-run: false
      # 自动注册的权限点归属的子系统
      subsystem: default-sub-system
      # 跳过扫描的路径前缀：这些是基础设施端点，本就不是权限点
      excluded-paths:
        - /actuator
        - /error
        - /swagger
        - /v3/api-docs
        - /webjars

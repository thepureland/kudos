kudos:
  ability:
    data:
      redis:
        default-redis: data
        redis-map:
          data:
            host: localhost #单机模式下使用
            port: 6379 #单机模式下使用
            password:
            database: 0 # 使用数据库的索引编号，一个示例有16个数据库 0 到 15
#            ssl: false
            max-active: -1 # 连接池最大连接数；负数=不限制（commons-pool2 语义）
            max-idle: 10
            max-wait: -1ms
            min-idle: 0
            timeout: 3000 # 命令超时时间（毫秒），映射到 Lettuce commandTimeout；不配则为 Lettuce 默认 60s
#            connect-timeout: 3000 # TCP 建连超时时间（毫秒）
#            read-from: replicaPreferred # Lettuce 读偏好；主从/集群下读可能有复制延迟，需强一致读改为 master
            key-serializer: string #RedisSerializerEnum 枚举字面值，或 RedisSerializer 实现类全限定名
            hashkey-serializer: string
            value-serializer: fastjson #jackson默认不支持jdk8的LocalDateTime、LocalDate、LocalTime
            hashvalue-serializer: fastjson #jackson默认不支持jdk8的LocalDateTime、LocalDate、LocalTime
    #        cluster:
    #          max-redirects: 3 # 集群模式下，集群最大转发的数量
    #          nodes: # 集群模式下，逗号分隔的键值对（主机：端口）形式的服务器列表
    #            - 127.0.0.1:6379
    #            - 127.0.0.1:6380

spring:
  main:
    # Workaround for Spring Boot 4.1: io.kudos.context.init.ValidatorAutoConfiguration#defaultValidator
    # clashes with org.springframework.boot.validation.autoconfigure.ValidationAutoConfiguration#defaultValidator.
    # Remove once kudos-context backs off (e.g. @ConditionalOnMissingBean) on the boot-provided bean.
    allow-bean-definition-overriding: true
  cloud:
    # Workaround for Spring Boot 4.1: the current Spring Cloud release train does not yet list
    # Boot 4.1 as compatible and CompositeCompatibilityVerifier fails the context.
    compatibility-verifier:
      enabled: false
    stream:
      function:
        #配置消费者消费的方法名称，按bindings顺序，多个以英文分号隔开
        definition: consumer
      bindings:
        consumer-in-0:
          destination: RABBIT_TEST_TOPIC
  datasource:
    dynamic:
      primary: ds-master
      hikari:
        connection-timeout: 3000
        validation-timeout: 5000
        idle-timeout: 600000
        leak-detection-threshold: 0
        max-lifetime: 1800000
        max-pool-size: 10
        min-idle: 10
        initialization-fail-timeout: 1
        is-auto-commit: false
        is-read-only: false
        is-isolate-internal-queries: false
        is-register-mbeans: false
        is-allow-pool-suspension: false
      datasource:
        ds-master:
          hikari:
            is-auto-commit: false
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:ds-master;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;
          username: sa
          password: sa

kudos:
  ability:
    distributed:
      stream:
        save-exception: true
    flyway:
      datasource-config:
        ds-master: mq


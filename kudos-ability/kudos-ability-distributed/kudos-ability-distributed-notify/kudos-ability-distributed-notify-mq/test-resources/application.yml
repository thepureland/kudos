spring:
  main:
    # Workaround for Spring Boot 4.1: io.kudos.context.init.ValidatorAutoConfiguration#defaultValidator
    # clashes with org.springframework.boot.validation.autoconfigure.ValidationAutoConfiguration#defaultValidator.
    # Same precedent as kudos-ability-distributed-stream-rocketmq test resources.
    # Remove once kudos-context backs off (e.g. @ConditionalOnMissingBean) on the boot-provided bean.
    allow-bean-definition-overriding: true
    # Workaround for a suspected main-code bug: NotifyMqAutoConfiguration field-injects
    # NotifyCommonProperties, but that bean is produced by an inherited @Bean method of the very
    # same configuration class, forming a config-bean <-> properties-bean cycle that fails with
    # BeanCurrentlyInCreationException under the Boot default allow-circular-references=false.
    # Proper fix: replace the @Autowired field with ObjectProvider/method-parameter injection.
    allow-circular-references: true
  cloud:
    # Workaround for Spring Boot 4.1: the current Spring Cloud release train does not yet list
    # Boot 4.1 as compatible and CompositeCompatibilityVerifier fails the context.
    compatibility-verifier:
      enabled: false
  datasource:
    dynamic:
      primary: ds-master
      hikari:
        connection-timeout: 30000
        validation-timeout: 5000
        idle-timeout: 600000
        leak-detection-threshold: 0
        max-lifetime: 1800000
        max-pool-size: 10
        min-idle: 10
        initialization-fail-timeout: 1
        is-auto-commit: false
        is-read-only: false
        is-isolate-internal-queries: false
        is-register-mbeans: false
        is-allow-pool-suspension: false
      datasource:
        ds-master:
          hikari:
            is-auto-commit: false
          driver-class-name: org.h2.Driver
          url: jdbc:h2:~/h2/ds-master;DATABASE_TO_LOWER=TRUE;
          username: sa
          password: sa
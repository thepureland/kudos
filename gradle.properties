# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# The default daemon heap is too small to compile kudos-base in one go: a full (non-incremental) recompile
# dies with OutOfMemoryError. Any change invalidating the whole build - editing gradle/libs.versions.toml,
# a daemon restart - hits that path, so the heap is raised here rather than per-invocation.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
# Kotlin compiles in a separate daemon; pin its heap explicitly rather than relying on what it inherits.
# https://kotlinlang.org/docs/gradle-compilation-and-caches.html#setting-kotlin-daemon-s-jvm-arguments
kotlin.daemon.jvmargs=-Xmx4g
